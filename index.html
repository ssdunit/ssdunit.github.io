<main>
  <section class="hero wrap" id="top">
    <div>
      <div class="namewrap h-in" id="namewrap" style="--d:0ms" title="Click to switch">
        <p class="hello" id="hello"></p>
        <h1 class="name" id="name" aria-label="Sunit Dighe"><span class="en">Sunit Dighe</span></h1>
      </div>
      <p class="lead h-in" id="lead" style="--d:160ms"></p>
      <div class="acts h-in" style="--d:240ms">
        <a class="btn pri" href="#projects">View projects</a>
        <a class="btn" href="#contact">Get in touch</a>
      </div>
    </div>
    <div class="h-in hero-photo" style="--d:200ms">
      <img src="./src/assets/hero.jpg" alt="Sunit Dighe" class="hero-img" width="720" height="900" fetchpriority="high" decoding="async">
    </div>
  </section>

  <div class="wrap">
    <section class="sec" id="intro">
      <div class="sec-h"><h2>Intro</h2><span class="rule"></span></div>
      <div class="prose" id="intro-text"></div>
      <div class="chips" id="intro-tags"></div>
    </section>

    <section class="sec" id="projects">
      <div class="sec-h"><h2>Projects</h2><span class="rule"></span></div>
      <div class="grid2" id="grid-proj"></div>
    </section>

    <section class="sec" id="writing">
      <div class="sec-h"><h2>Writing</h2><span class="rule"></span></div>
      <div class="prose"><p id="writing-text"></p></div>
      <div class="acts">
        <a class="btn pri" id="writing-link" target="_blank" rel="noopener"></a>
      </div>
    </section>

    <section class="sec" id="contact">
      <div class="sec-h"><h2>Get in touch</h2><span class="rule"></span></div>
      <div class="tbl" id="tbl"></div>
    </section>

    <footer>
      <span id="footer-text"></span>
    </footer>
  </div>
</main>

<div class="pixel-cat" id="pixelCat" role="button" tabindex="0" aria-label="A pixel cat. Click for a tip.">
  <div class="pc-scene">
    <div class="pc-stage">
      <div class="pc-sprite pc-cat"></div>
      <div class="pc-sprite pc-box"></div>
    </div>
  </div>
  <span class="pc-hint">psst, click me</span>
</div>
<div class="cat-bubble" id="catBubble" role="status" aria-live="polite"></div>
